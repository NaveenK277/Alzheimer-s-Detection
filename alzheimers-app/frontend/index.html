<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuroScan — Alzheimer's Detection</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">

  <div class="bg-grid"></div>
  <div class="scan-line"></div>

  <div class="login-wrapper">

    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 2"/>
          <path d="M12 20 C12 14, 20 10, 20 20 C20 10, 28 14, 28 20 C28 27, 20 32, 20 28 C20 32, 12 27, 12 20Z" fill="var(--accent)" opacity="0.85"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-name">NeuroScan</h1>
        <p class="brand-sub">Alzheimer's Early Detection System</p>
      </div>
    </div>

    <div class="login-card">
      <h2 class="card-title">Clinician Login</h2>
      <p class="card-desc">Access the MRI analysis dashboard</p>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>

      <p class="error-msg" id="loginError"></p>

      <button class="btn-primary" onclick="handleLogin()">
        <span>Sign In</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <p class="hint">Demo: username <strong>admin</strong> / password <strong>1234</strong></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
